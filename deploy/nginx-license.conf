# 授权码后台 —— Nginx 反向代理（备选，Caddy 不可用时）
#
# 证书用 certbot 申请：
#   apt install certbot python3-certbot-nginx
#   certbot --nginx -d license.example.com
#
# 把 license.example.com 换成你的域名后放到 /etc/nginx/conf.d/ 下。

server {
    listen 80;
    listen [::]:80;
    server_name license.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name license.example.com;

    # certbot 会自动填入下面两行
    ssl_certificate     /etc/letsencrypt/live/license.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/license.example.com/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 管理页只允许自己的出口 IP（按需启用）
    # location /admin/ {
    #     allow 203.0.113.10;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8090;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}
