<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手机中控</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; min-height:100%; }
  body {
    background:#2b2b2b;
    color:#e9e9e9;
    font:12px/1.4 "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    overflow:auto;
  }
  .notice-bar {
    height:48px;
    display:flex;
    align-items:center;
    padding:0 12px;
    background:#39a9b0;
    color:#111;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .workspace {
    display:flex; gap:8px;
    padding:14px 16px 16px;
    align-items:flex-start;
    height:calc(100vh - 48px);
    min-height:520px;
  }
  .toolbar { width:105px; flex:0 0 105px; display:flex; flex-direction:column; gap:5px; overflow-y:auto; }
  .btn {
    appearance:none; border:0; border-radius:2px;
    background:#2196f3; color:#fff; height:25px; padding:0 8px;
    font-size:11px; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.25);
    white-space:nowrap; text-align:center;
  }
  .btn:hover { background:#1e88e5; }
  .btn:active { background:#1565c0; }
  .btn:disabled { opacity:.55; cursor:not-allowed; }
  .btn.red { background:#e91e63; }
  .btn.red:hover { background:#c2185b; }
  .btn.green { background:#4caf50; }
  .btn.green:hover { background:#388e3c; }
  .btn-row { display:flex; align-items:center; gap:4px; }
  .btn-row .btn { flex:1; }
  .switch {
    width:34px; height:18px; border-radius:9px; flex:0 0 34px;
    background:#cfd8dc; position:relative; cursor:pointer;
  }
  .switch::after {
    content:""; position:absolute; top:2px; left:2px;
    width:14px; height:14px; border-radius:50%; background:#607d8b;
    transition:left .15s ease;
  }
  .switch.on { background:#ffca28; }
  .switch.on::after { left:18px; background:#fff; }
  .panel {
    border:1px solid #666; min-width:0;
    flex:0 1 auto; max-width:calc(100vw - 150px);
    background:#2b2b2b; padding:6px;
    display:flex; flex-direction:column; min-height:0;
  }
  .screen-row { display:flex; gap:6px; align-items:flex-start; min-height:0; }
  .phone {
    position:relative; flex:0 0 auto;
    /* Height follows the viewport so a large monitor gets a large screen;
       the width is derived from the 375x667 device aspect ratio. Driving the
       size from height keeps the input row visible on short windows too. */
    height:clamp(360px, calc(100vh - 200px), 900px);
    aspect-ratio:375 / 667;
    border:1px solid #ccc; background:#111; overflow:hidden;
  }
  .phone img {
    width:100%; height:100%; object-fit:fill; display:block;
    cursor:crosshair; user-select:none; -webkit-user-drag:none;
  }
  .phone .mask {
    position:absolute; inset:0; background:rgba(0,0,0,.45);
    color:#f5f5f5; padding:18px 14px; font-size:14px; line-height:1.6;
    display:none; white-space:pre-line;
    /* While visible the mask must swallow every mouse event on the screen. */
    pointer-events:auto; cursor:not-allowed;
  }
  .phone .mask.show { display:block; }
  .thumbs {
    display:flex; gap:6px; flex:1 1 auto; min-width:0;
    flex-wrap:wrap; align-content:flex-start; overflow-y:auto;
    /* Match the phone height so a long device list scrolls instead of
       pushing the input row below the fold. */
    max-height:clamp(360px, calc(100vh - 200px), 900px);
  }
  .thumb { width:67px; cursor:pointer; text-align:center; color:#cfd8dc; font-size:10px; }
  .thumb .box {
    width:67px; height:145px; border:1px solid #777; background:#4caf50;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .thumb img { width:100%; height:100%; object-fit:fill; }
  .thumb.active .box { border-color:#ffca28; }
  .input-row { display:flex; align-items:flex-end; gap:8px; padding:2px 0 0; }
  .input-row textarea {
    width:210px; height:58px; resize:none; background:#fff; color:#111;
    border:1px solid #999; padding:5px;
    font:12px/1.4 "Microsoft YaHei", Arial, sans-serif;
  }
  .input-actions { display:flex; flex-direction:column; gap:5px; }
  .input-actions .btn { width:100px; }
  .group-row { display:flex; align-items:center; gap:4px; }
  .group-row .btn { width:auto; padding:0 8px; }
  .status-line { margin-top:2px; color:#b0bec5; font-size:11px; min-height:12px; }
  .modal {
    position:fixed; inset:0; background:rgba(0,0,0,.6);
    display:none; align-items:center; justify-content:center; z-index:10;
  }
  .modal.show { display:flex; }
  .modal-box {
    width:520px; max-height:80vh; background:#303030; border:1px solid #666; padding:14px; color:#eee;
  }
  .modal-box h3 { margin:0 0 10px; font-size:14px; }
  .modal-box .row { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .modal-box textarea { flex:1; min-height:50px; background:#fff; color:#111; border:1px solid #999; padding:5px; }
  .modal-box select {
    background:#fff; color:#111; border:1px solid #999; padding:4px 6px;
    font:12px "Microsoft YaHei", Arial, sans-serif; min-width:220px;
  }
  .modal-box .foot { display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
  @media (max-width:760px) {
    .workspace { padding:10px; height:auto; min-height:0; }
    .panel { width:calc(100vw - 130px); max-width:calc(100vw - 130px); }
    .phone { width:calc(100vw - 230px); height:auto; max-width:100%; }
    .thumbs { flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; }
  }
</style>
</head>
<body>
  <div class="notice-bar">通知： V0.1版本IOS群控系统【大幅提升连接数量】</div>

  <div class="workspace">
    <div class="toolbar">
      <button class="btn" data-action="reboot">重启手机</button>
      <button class="btn" data-action="status">检测设备状态</button>
      <button class="btn" data-action="regcode">填写注册码</button>
      <button class="btn" data-action="reauth">刷新授权</button>
      <div class="btn-row">
        <button class="btn" data-action="stream">投屏</button>
        <div class="switch" id="streamSwitch" title="投屏开关"></div>
      </div>
      <button class="btn" data-action="loadscreen">载入画面</button>
      <button class="btn" data-action="lock">锁屏</button>
      <button class="btn" data-action="unlock">解锁</button>
      <button class="btn" data-action="openapp">快捷打开应用</button>
      <button class="btn" data-action="home">关闭当前程序</button>
      <button class="btn" data-action="clipboard">获取粘贴板</button>
      <button class="btn" data-action="group">创建分组</button>
      <button class="btn" data-action="all">全部设备(<span id="allCount">0</span>)</button>
      <button class="btn" data-action="media">传图片视频</button>
      <button class="btn" data-action="resolution">调整分辨率</button>
      <button class="btn" data-action="orientation">横屏/竖屏</button>
      <button class="btn red" data-action="uninstall">快捷卸载应用</button>
      <div class="btn-row">
        <button class="btn" data-action="monitor">监控</button>
        <div class="switch" id="monitorSwitch" title="监控开关"></div>
      </div>
      <button class="btn green" data-action="script">打开脚本界面</button>
    </div>

    <div class="panel">
      <div class="screen-row">
        <div class="phone" id="phone">
          <img id="screen" alt="设备屏幕" hidden>
          <div class="mask show" id="screenMask">授权不成功，设备和本地均无储存注册码 正在检查授权状态,请稍后</div>
        </div>
        <div class="thumbs" id="thumbs"></div>
      </div>
      <div class="input-row">
        <textarea id="textInput" placeholder="请在这里输入内容,可以使用ctrl+v粘贴"></textarea>
        <div class="input-actions">
          <button class="btn" id="sendBtn">发送</button>
          <button class="btn" id="sendDifferentBtn">发送不同内容</button>
          <div class="group-row">
            <button class="btn" id="groupBtn">群 控</button>
            <div class="switch" id="groupSwitch" title="群控开关"></div>
          </div>
        </div>
      </div>
      <div class="status-line" id="status">正在查找已连接设备…</div>
    </div>
  </div>

  <div class="modal" id="differentModal">
    <div class="modal-box">
      <h3>发送不同内容</h3>
      <div id="differentRows"></div>
      <div class="foot">
        <button class="btn" id="differentCancel">取消</button>
        <button class="btn" id="differentSend">发送</button>
      </div>
    </div>
  </div>

  <div class="modal" id="screenModal">
    <div class="modal-box">
      <h3>画面与帧率</h3>
      <div class="row">
        <label style="width:72px">帧率上限</label>
        <select id="optFps">
          <option value="10">10 FPS（省带宽）</option>
          <option value="15">15 FPS</option>
          <option value="24">24 FPS</option>
          <option value="30">30 FPS</option>
          <option value="45">45 FPS</option>
          <option value="60">60 FPS（最流畅）</option>
        </select>
      </div>
      <div class="row">
        <label style="width:72px">画质</label>
        <select id="optQuality">
          <option value="25">低（流量最小）</option>
          <option value="50">中</option>
          <option value="75">高</option>
          <option value="90">最高</option>
        </select>
      </div>
      <div style="color:#9e9e9e;font-size:11px;line-height:1.6;margin-top:6px">
        iOS 不允许修改系统分辨率。这里调整的是投屏帧率与压缩画质：帧率越低、画质越低，
        USB/WiFi 占用越小，同时操控多台设备时更省资源。设置保存在浏览器本地。
      </div>
      <div class="foot">
        <button class="btn" id="screenCancel">取消</button>
        <button class="btn" id="screenApply">应用并重载画面</button>
      </div>
    </div>
  </div>

  <div class="modal" id="licenseModal">
    <div class="modal-box">
      <h3>授权状态</h3>
      <div id="licenseInfo"></div>
      <div class="foot">
        <button class="btn" id="licenseClose">关闭</button>
        <button class="btn" id="licenseRefresh">重新校验</button>
      </div>
    </div>
  </div>

<script>
const $ = sel => document.querySelector(sel);
const statusEl = $("#status");
const screen = $("#screen");
const screenMask = $("#screenMask");
const textInput = $("#textInput");
let devices = [];
let selectedUDID = "";
let groupControl = false;
let landscape = false;
let streaming = true;
let streamReady = false;
// Picture settings sent to /stream. Defaults match the previous hard-coded
// WDA values so behaviour is unchanged until the user edits them. The device
// scaling factor is pinned to 100: WDA encodes scaled frames far larger than
// full-size ones, so exposing it would only mislead.
const SCREEN_OPTS_KEY = "gpm.screenOptions";
let screenOpts = {fps:60, quality:25};
try {
  const saved = JSON.parse(localStorage.getItem(SCREEN_OPTS_KEY) || "null");
  if (saved && saved.fps && saved.quality) screenOpts = {fps:saved.fps, quality:saved.quality};
} catch (_) {}

function streamQuery() {
  return `fps=${screenOpts.fps}&quality=${screenOpts.quality}&scale=100`;
}
let streamOpening = false;
let streamTimer = null;
let streamAttempts = 0;
const autoConnected = new Set();
// Authorization comes from the backend, which reconciles 授权码.xlsx with the
// license server. Until the first response arrives we assume "checking".
let license = {authorized:false, reason:"正在检查授权状态…"};

function setStatus(text) { statusEl.textContent = text; }

async function api(path, options = {}) {
  const init = {...options};
  if (init.body && !init.headers) init.headers = {"Content-Type":"application/json"};
  const res = await fetch(path, init);
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok || (data && data.error)) throw new Error(data?.error || `请求失败 ${res.status}`);
  return data;
}

function currentDevice() { return devices.find(d => d.udid === selectedUDID) || devices[0]; }
function targetDevices() {
  if (groupControl) return devices.filter(d => d.sessionId && d.authorized);
  const d = currentDevice();
  return d && d.authorized ? [d] : [];
}

function escapeHTML(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function renderThumbs() {
  const box = $("#thumbs");
  box.innerHTML = "";
  devices.filter(d => d.udid !== selectedUDID).forEach(d => {
    const el = document.createElement("div");
    el.className = "thumb";
    el.dataset.udid = d.udid;
    el.innerHTML = `<div class="box"><img src="/api/devices/${encodeURIComponent(d.udid)}/screenshot?preview=1&ts=${Date.now()}" alt=""></div><div>${escapeHTML(d.name || "iPhone")}</div>`;
    el.onclick = () => selectDevice(d.udid);
    box.appendChild(el);
  });
}

function showMask(text) {
  screenMask.textContent = text;
  screenMask.classList.add("show");
}

function hideMask() {
  screenMask.classList.remove("show");
}

// The mask is the single source of truth for whether the screen accepts input.
// Licensing is per phone, so the mask follows the currently selected device.
function updateMask() {
  const d = currentDevice();
  if (!d) {
    showMask("没有发现已连接的 iPhone，请接入设备后点击“检测设备状态”。");
    return;
  }
  if (!d.authorized) {
    showMask(`该设备未授权：${d.licenseReason || license.reason || "请联系管理员获取授权码"}`);
    return;
  }
  if (!streaming) {
    showMask("投屏已关闭，打开“投屏”开关后即可操作");
    return;
  }
  if (!streamReady) {
    showMask("正在载入画面…");
    return;
  }
  hideMask();
}

function screenBlocked() {
  return screenMask.classList.contains("show");
}

function render() {
  $("#allCount").textContent = devices.length;
  const d = currentDevice();
  if (!d) {
    screen.hidden = true;
    updateMask();
    renderThumbs();
    return;
  }
  updateMask();
  renderThumbs();
}

async function refreshDevices() {
  try {
    const data = await api("/api/devices");
    await refreshLicenseState();
    const old = selectedUDID;
    devices = data.devices || [];
    if (!devices.some(d => d.udid === selectedUDID)) {
      selectedUDID = (devices.find(d => d.sessionId) || devices[0] || {}).udid || "";
    }
    if (old !== selectedUDID) stopStreamOnly();
    render();
    setStatus(`已发现 ${devices.length} 台设备`);
    const d = currentDevice();
    if (d && !d.sessionId && !autoConnected.has(d.udid)) {
      autoConnected.add(d.udid);
      ensureSession().then(() => {
        if (streaming && !streamReady && !streamOpening && !streamTimer) startStream();
      }).catch(() => {});
    } else if (d && d.sessionId && streaming && !streamReady && !streamOpening && !streamTimer) {
      startStream();
    }
  } catch (e) {
    setStatus(`检测设备状态失败：${e.message}`);
  }
}

async function selectDevice(udid) {
  selectedUDID = udid;
  stopStream();
  render();
  await ensureSession().catch(() => {});
}

// Pull the authoritative license state from the backend. The backend is the
// only place that knows whether 授权码.xlsx matches the server bindings.
async function refreshLicenseState() {
  try {
    license = await api("/api/license");
  } catch (e) {
    license = {authorized:false, reason:`读取授权状态失败：${e.message}`};
  }
  updateMask();
  return license;
}

async function ensureSession() {
  const d = currentDevice();
  if (!d) throw new Error("没有可用设备");
  if (d.sessionId) return d.sessionId;
  const data = await api(`/api/devices/${encodeURIComponent(d.udid)}/session`, {method:"POST", body:"{}"});
  d.sessionId = data.sessionId;
  d.sessionType = data.sessionType || "Appium";
  render();
  return d.sessionId;
}

async function singleOrBatch(operation, body) {
  if (groupControl && devices.filter(d => d.sessionId).length > 1) {
    return api("/api/batch", {
      method:"POST",
      body:JSON.stringify({operation, udids:targetDevices().map(d => d.udid), body})
    });
  }
  const d = currentDevice();
  if (!d) throw new Error("没有可用设备");
  await ensureSession();
  // Operation names match the route segments one-to-one (tap/swipe/type/actions/app).
  // Hardcoding a subset here silently routed tap and swipe to /type.
  return api(`/api/devices/${encodeURIComponent(d.udid)}/${operation}`, {method:"POST", body:JSON.stringify(body)});
}

async function doAction(action) {
  const d = currentDevice();
  try {
    switch (action) {
      case "status":
        await refreshDevices(); break;
      case "reboot":
        if (!confirm("确定重启手机吗？")) return;
        setStatus("正在重启…");
        await singleOrBatch("actions", {action:"reboot"});
        setStatus("重启指令已发送"); break;
      case "lock":
      case "unlock":
      case "home":
        await singleOrBatch("actions", {action});
        setStatus("操作已发送"); break;
      case "orientation":
        landscape = !landscape;
        await singleOrBatch("actions", {action:"orientation", orientation:landscape ? "LANDSCAPE" : "PORTRAIT"});
        setStatus(landscape ? "已切换为横屏" : "已切换为竖屏"); break;
      case "stream":
        toggleStream(); break;
      case "loadscreen":
        if (!d) throw new Error("没有可用设备");
        await ensureSession();
        startStream();
        setStatus("已重新载入画面"); break;
      case "openapp": {
        const id = prompt("输入要打开的 Bundle ID", "com.tencent.xin");
        if (!id) return;
        await singleOrBatch("app", {action:"open", bundleId:id});
        setStatus("已发送打开应用指令"); break;
      }
      case "uninstall": {
        const id = prompt("输入要卸载的 Bundle ID", "");
        if (!id) return;
        await singleOrBatch("app", {action:"uninstall", bundleId:id});
        setStatus("已发送卸载应用指令"); break;
      }
      case "clipboard": {
        if (!d) throw new Error("没有可用设备");
        await ensureSession();
        const data = await api(`/api/devices/${encodeURIComponent(d.udid)}/clipboard`);
        textInput.value = data.value || data.content || data.text || "";
        setStatus("已读取粘贴板"); break;
      }
      case "group": {
        if (!d) throw new Error("没有可用设备");
        const name = prompt("输入分组名称", d.group || "");
        if (name === null) return;
        await api(`/api/devices/${encodeURIComponent(d.udid)}/settings`, {
          method:"POST", body:JSON.stringify({name:d.name || "", group:name, appiumUrl:d.appiumUrl || ""})
        });
        setStatus("分组已保存"); break;
      }
      case "all":
        groupControl = !groupControl;
        syncSwitches();
        setStatus(groupControl ? "已开启全设备控制" : "已关闭全设备控制"); break;
      case "regcode":
        openLicenseInfo();
        break;
      case "reauth": {
        const state = await refreshLicenseState();
        setStatus(state.authorized
          ? `授权有效${state.code ? "（" + state.code + "）" : ""}`
          : `授权无效：${state.reason || "未知原因"}`);
        break;
      }
      case "resolution":
        openScreenSettings(); break;
      case "media":
      case "monitor":
      case "script":
        setStatus("该按钮为原界面占位，当前 Go 版本暂未实现对应后端能力"); break;
      default:
        setStatus(`未知操作：${action}`);
    }
  } catch (e) {
    setStatus(`操作失败：${e.message}`);
  }
}

function syncSwitches() {
  $("#streamSwitch").classList.toggle("on", streaming);
  $("#monitorSwitch").classList.remove("on");
  $("#groupSwitch").classList.toggle("on", groupControl);
}

function toggleStream() {
  streaming = !streaming;
  syncSwitches();
  if (streaming) startStream(); else stopStream();
}

function scheduleStreamRetry(delay) {
  clearTimeout(streamTimer);
  streamTimer = null;
  if (!streaming) return;
  streamTimer = setTimeout(() => {
    streamTimer = null;
    openStream();
  }, delay);
}

async function openStream() {
  if (!streaming || streamOpening) return;
  const d = currentDevice();
  if (!d) return;
  streamOpening = true;
  try {
    await ensureSession();
    if (!streaming) return;
    clearTimeout(streamTimer);
    streamTimer = null;
    screen.onload = () => {
      streamReady = true;
      streamAttempts = 0;
      updateMask();
    };
    screen.onerror = () => {
      streamReady = false;
      streamAttempts++;
      const delay = Math.min(15000, 1000 * streamAttempts);
      updateMask();
      setStatus(`视频流中断，${Math.round(delay / 1000)} 秒后重连（第 ${streamAttempts} 次）`);
      scheduleStreamRetry(delay);
    };
    screen.src = `/api/devices/${encodeURIComponent(d.udid)}/stream?${streamQuery()}&ts=${Date.now()}`;
    screen.hidden = false;
  } catch (e) {
    streamAttempts++;
    setStatus(`投屏失败：${e.message}`);
    scheduleStreamRetry(Math.min(15000, 1000 * streamAttempts));
  } finally {
    streamOpening = false;
  }
}

function startStream() {
  streaming = true;
  stopStreamOnly();
  syncSwitches();
  openStream();
}

function stopStreamOnly() {
  clearTimeout(streamTimer);
  streamTimer = null;
  screen.onload = null;
  screen.onerror = null;
  screen.removeAttribute("src");
  screen.hidden = true;
  streamReady = false;
  updateMask();
}

function stopStream() {
  streaming = false;
  stopStreamOnly();
  syncSwitches();
}

async function sendText() {
  const text = textInput.value;
  if (!text.trim()) { setStatus("请先输入要发送的文字"); return; }
  try {
    if (groupControl && devices.filter(d => d.sessionId).length > 1) {
      await api("/api/batch", {
        method:"POST",
        body:JSON.stringify({operation:"type", targets:targetDevices().map(d => ({udid:d.udid, body:JSON.stringify({text})}))})
      });
    } else {
      await singleOrBatch("type", {text});
    }
    setStatus("文字已发送");
  } catch (e) {
    setStatus(`发送失败：${e.message}`);
  }
}

function openDifferentModal() {
  const rows = targetDevices();
  if (!rows.length) { setStatus("没有可发送的设备"); return; }
  const box = $("#differentRows");
  box.innerHTML = rows.map(d => `
    <div class="row"><span style="width:120px">${escapeHTML(d.name || d.udid)}</span>
    <textarea data-udid="${escapeHTML(d.udid)}">${escapeHTML(textInput.value)}</textarea></div>`).join("");
  $("#differentModal").classList.add("show");
}

async function sendDifferent() {
  const items = [...document.querySelectorAll("#differentRows textarea")].map(t => ({
    udid:t.dataset.udid,
    body:JSON.stringify({text:t.value})
  }));
  try {
    await api("/api/batch", {method:"POST", body:JSON.stringify({operation:"type", targets:items})});
    $("#differentModal").classList.remove("show");
    setStatus("差异化内容已发送");
  } catch (e) {
    setStatus(`发送失败：${e.message}`);
  }
}

function bindScreenInput() {
  let start = null;

  // Right-click over the mirrored screen means "go to the home screen". The
  // browser context menu must be suppressed, otherwise it covers the device.
  $("#phone").addEventListener("contextmenu", async e => {
    e.preventDefault();
    if (screenBlocked()) return;
    const d = currentDevice();
    if (!d) return;
    try {
      await ensureSession();
      await singleOrBatch("actions", {action:"home"});
      setStatus("已返回主屏幕");
    } catch (err) {
      setStatus(`返回主屏失败：${err.message}`);
    }
  });

  screen.addEventListener("pointerdown", e => {
    // Only the primary button taps/swipes; other buttons belong to contextmenu.
    if (e.button !== 0) return;
    if (screenBlocked()) return;
    start = {x:e.offsetX, y:e.offsetY};
  });
  screen.addEventListener("pointerup", async e => {
    if (e.button !== 0) { start = null; return; }
    if (screenBlocked()) { start = null; return; }
    if (!start) return;
    const dx = e.offsetX - start.x, dy = e.offsetY - start.y;
    const moved = Math.abs(dx) > 8 || Math.abs(dy) > 8;
    const d = currentDevice();
    if (!d) return;
    try {
      await ensureSession();
      const scaleX = 375 / (screen.clientWidth || 375);
      const scaleY = 667 / (screen.clientHeight || 667);
      if (moved) {
        await singleOrBatch("swipe", {
          x1:Math.round(start.x * scaleX), y1:Math.round(start.y * scaleY),
          x2:Math.round(e.offsetX * scaleX), y2:Math.round(e.offsetY * scaleY),
          durationMs:500, imageWidth:375, imageHeight:667
        });
      } else {
        await singleOrBatch("tap", {
          x:Math.round(e.offsetX * scaleX), y:Math.round(e.offsetY * scaleY),
          imageWidth:375, imageHeight:667
        });
      }
    } catch (err) {
      setStatus(`屏幕操作失败：${err.message}`);
    }
    start = null;
  });
}

document.querySelectorAll(".toolbar [data-action]").forEach(btn => {
  btn.onclick = () => doAction(btn.dataset.action);
});
$("#sendBtn").onclick = sendText;
textInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    sendText();
  }
});
$("#sendDifferentBtn").onclick = openDifferentModal;
$("#differentCancel").onclick = () => $("#differentModal").classList.remove("show");
$("#differentSend").onclick = sendDifferent;

function openScreenSettings() {
  $("#optFps").value = String(screenOpts.fps);
  $("#optQuality").value = String(screenOpts.quality);
  $("#screenModal").classList.add("show");
}

function applyScreenSettings() {
  const next = {
    fps: parseInt($("#optFps").value, 10) || 60,
    quality: parseInt($("#optQuality").value, 10) || 25
  };
  screenOpts = next;
  try { localStorage.setItem(SCREEN_OPTS_KEY, JSON.stringify(next)); } catch (_) {}
  $("#screenModal").classList.remove("show");
  // WDA applies these when the stream opens, so the stream has to be reopened.
  if (streaming) startStream();
  setStatus(`画面设置已应用：${next.fps} FPS / 画质 ${next.quality}`);
}

$("#screenCancel").onclick = () => $("#screenModal").classList.remove("show");
$("#screenApply").onclick = applyScreenSettings;

function openLicenseInfo() {
  const l = license || {};
  const rows = [
    ["校验方式", l.offline ? "离线（本地备份）" : "在线（授权服务器）"],
    ["说明", l.reason || "—"],
    ["授权服务器", l.server || "未配置"],
    ["授权码表格", l.tablePath || "—"],
    ["本地备份", l.backupPath || "—"],
    ["表格授权码数", String(l.codeCount ?? 0)],
    ["最近校验", l.checkedAt || "—"]
  ];
  let html = rows.map(([k, v]) =>
    `<div class="row"><span style="width:110px;flex:0 0 110px;color:#9e9e9e">${k}</span><span style="word-break:break-all">${escapeHTML(v)}</span></div>`
  ).join("");

  const list = devices || [];
  if (list.length) {
    html += `<div style="margin-top:10px;color:#9e9e9e">各设备授权</div>`;
    html += list.map(d => {
      const mark = d.authorized ? "已授权" : "未授权";
      const color = d.authorized ? "#4caf50" : "#e91e63";
      const detail = d.authorized
        ? escapeHTML(d.licenseCode || "")
        : escapeHTML(d.licenseReason || l.reason || "");
      return `<div class="row"><span style="width:110px;flex:0 0 110px;color:#9e9e9e">${escapeHTML(d.name || "iPhone")}</span>`
        + `<span><span style="color:${color}">${mark}</span> ${detail}</span></div>`;
    }).join("");
  }

  $("#licenseInfo").innerHTML = html;
  $("#licenseModal").classList.add("show");
}

$("#licenseClose").onclick = () => $("#licenseModal").classList.remove("show");
$("#licenseRefresh").onclick = async () => {
  await refreshLicenseState();
  openLicenseInfo();
};

$("#groupBtn").onclick = () => doAction("all");
bindScreenInput();
syncSwitches();
refreshDevices();
setInterval(refreshDevices, 10000);
</script>
