<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>海涛中控 v0.1</title>
  <style>
    :root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#172033;background:#f3f6fb;font-synthesis:none;font-optical-sizing:auto}
    *{box-sizing:border-box}
    body{margin:0;min-width:320px;background:#f3f6fb}
    header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);border-bottom:1px solid #e4e9f1;padding:14px clamp(16px,3vw,40px);display:flex;align-items:center;justify-content:space-between;gap:20px;backdrop-filter:blur(12px)}
    .brand{display:flex;align-items:center;gap:12px}
    .brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#3478f6,#2253c7);display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px;box-shadow:0 5px 12px #245bc633}
    h1{font-size:19px;letter-spacing:.01em;margin:0}
    header p{margin:3px 0 0;color:#778196;font-size:12px}
    .header-actions{display:flex;align-items:center;gap:9px}
    #all-devices-toggle.active,#preview-live-toggle.active{background:#13845b}
    #all-devices-toggle.active:hover,#preview-live-toggle.active:hover{background:#0b6d49}
    #mass-send-toggle.active{background:#7a4fd6}
    #mass-send-toggle.active:hover{background:#6840bd}
    main{max-width:1680px;margin:0 auto;padding:24px clamp(16px,3vw,40px) 40px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px;gap:12px;min-height:36px}
    #notice{color:#3f4b60;font-size:13px}
    #last-refresh{color:#8a94a6;font-size:12px;white-space:nowrap}
    .workspace{display:grid;grid-template-columns:minmax(0,1fr);align-items:start;gap:16px}
    .workspace.has-devices{grid-template-columns:minmax(0,1fr) var(--preview-size,220px)}
    .grid{min-width:0}
    .card{display:grid;grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto auto;grid-template-areas:"head head" "screen side";gap:14px 18px;width:100%;min-height:0;background:#fff;border:1px solid #e3e8f0;border-radius:16px;padding:18px;box-shadow:0 8px 26px #1e293b0a}
    .device-list{width:100%;min-width:0;background:#fff;border:1px solid #e3e8f0;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 26px #1e293b0a}
    .device-list[hidden]{display:none}
    .device-list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
    .device-list-count{font-size:11px;color:#69758a;background:#f1f4f9;border-radius:20px;padding:4px 8px;white-space:nowrap}
    .preview-size-control{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;font-size:11px;color:#69758a}
    .device-list-summary{font-size:11px;color:#8993a5;line-height:1.5}
    .device-items{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 300px);overflow:auto;padding-right:2px}
    .device-group-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;font-weight:650;color:#5c6880;padding:6px 4px 4px;border-bottom:1px dashed #dfe5ee;margin-top:2px}
    .device-group-head .gap{font-weight:400;color:#93a0b3}
    .device-item{display:flex;flex-direction:column;min-width:0;border:1px solid #e3e8f0;background:#fff;border-radius:12px;cursor:pointer;overflow:hidden;transition:border-color .15s,box-shadow .15s}
    .device-item:hover{border-color:#9bb8f4;box-shadow:0 4px 12px #1e293b10}
    .device-item.current{border:2px solid #3478f6}
    .device-preview{position:relative;aspect-ratio:9/13;background:#101827;display:grid;place-items:center;overflow:hidden}
    .device-thumb{display:block;width:100%;height:100%;object-fit:contain}
    .device-thumb-placeholder{color:#c7d0de;text-align:center;padding:8px;font-size:11px}
    .device-preview-status{position:absolute;left:7px;bottom:7px;padding:4px 7px;border-radius:20px;background:#101827d9;color:#fff;font-size:10px;display:flex;align-items:center;gap:4px}
    .device-preview-status.live::before{content:"";width:5px;height:5px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px #4ade8033;animation:preview-pulse 1.4s ease-in-out infinite}
    @keyframes preview-pulse{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
    .device-item-footer{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:9px}
    .device-item-name{font-size:12px;font-weight:600;overflow-wrap:anywhere}
    .device-item-meta{font-size:10px;color:#8993a5;overflow-wrap:anywhere;margin-top:3px}
    .device-item-actions{display:flex;align-items:center;justify-content:flex-end;gap:4px}
    .device-item-actions button{padding:5px 8px;font-size:10px}
    .device-master{font-size:10px;color:#3570da;white-space:nowrap}
    .card-head{grid-area:head;display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0;padding:0 0 13px;border-bottom:1px solid #edf0f5}
    .device-heading{min-width:0}
    .card h2{margin:0 0 4px;font-size:17px;overflow-wrap:anywhere}
    .meta{font-size:11px;color:#8490a2;overflow-wrap:anywhere}
    .badge{white-space:normal;border-radius:20px;background:#e8f7f0;color:#12805a;padding:6px 10px;font-size:11px;font-weight:600}
    .badge.off{background:#f0f2f6;color:#677287}
    .side-panel{grid-area:side;display:flex;flex-direction:column;gap:14px;min-width:0;align-self:start}
    .panel-section{background:#f8fafd;border:1px solid #e8edf4;border-radius:12px;padding:12px}
    .section-title{font-size:12px;font-weight:650;margin:0 0 10px;color:#3b475c}
    .control-rail{display:flex;flex-direction:column;gap:8px;min-width:0}
    .connection-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .system-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
    .system-actions button{min-height:36px;padding:6px 4px;font-size:11px}
    .settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
    .settings .appium-url,.settings .save{grid-column:1/-1}
    input,textarea{width:100%;border:1px solid #dce3ed;border-radius:8px;background:#fff;color:#172033;padding:9px 10px;font:inherit;font-size:12px;outline:none;transition:border-color .15s,box-shadow .15s}
    input:focus,textarea:focus{border-color:#6c9bf5;box-shadow:0 0 0 3px #3478f61a}
    input[type=range]{width:100%;height:18px;margin:0;padding:0;border:0;border-radius:0;background:transparent;accent-color:#3478f6;box-shadow:none;cursor:pointer}
    input[type=range]:focus{box-shadow:none}
    button{border:0;border-radius:8px;padding:9px 11px;background:#3478f6;color:#fff;font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,transform .15s}
    button:hover{background:#225fdb}
    button:active{transform:translateY(1px)}
    button.secondary{background:#eaf1ff;color:#285fc8}
    button.secondary:hover{background:#dce8ff}
    button.danger{background:#fff0f0;color:#c44444}
    button.danger:hover{background:#ffe0e0}
    button:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .screen-wrap{grid-area:screen;position:relative;background:radial-gradient(ellipse at center,#1d2738,#0c111b 72%);border:1px solid #263142;border-radius:12px;overflow:hidden;width:min(100%,calc((100vh - 250px)*9/16));aspect-ratio:9/16;min-height:0;align-self:start;justify-self:center;display:grid;place-items:center}
    .screen{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-drag:none}
    .screen-placeholder{color:#aab5c5;text-align:center;padding:24px;font-size:13px}
    .screen-placeholder::before{content:"";display:block;width:42px;height:66px;margin:0 auto 13px;border:2px solid #68778c;border-radius:10px;box-shadow:inset 0 0 0 3px #0c111b}
    .composer{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:start}
    .composer .section-title,.composer .message{grid-column:1/-1}
    .composer .type-text{grid-column:1;min-height:38px}
    .composer .type{grid-column:2;grid-row:2;min-height:38px}
    .composer .type-enter{grid-column:3;grid-row:2;min-height:38px}
    .app-tools{display:flex;flex-direction:column;gap:8px}
    .app-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .clipboard{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:7px}
    textarea{min-height:72px;resize:vertical}
    .message{color:#637087;font-size:11px;align-self:center;min-height:15px}
    .empty{background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:32px;color:#778196;text-align:center}
    .modal-backdrop{position:fixed;inset:0;z-index:20;background:#0f172a66;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto}
    .modal-backdrop[hidden]{display:none}
    .mass-panel{width:min(980px,100%);background:#fff;border:1px solid #e3e8f0;border-radius:16px;box-shadow:0 24px 60px #0f172a33;overflow:hidden}
    .mass-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid #edf0f5}
    .mass-head h2{margin:0;font-size:17px}
    .mass-head p{margin:4px 0 0;color:#8490a2;font-size:12px}
    .mass-close{background:#f0f2f6;color:#48546a;padding:8px 12px}
    .mass-close:hover{background:#e4e8ef}
    .mass-body{padding:20px;display:flex;flex-direction:column;gap:18px}
    .mass-section{display:flex;flex-direction:column;gap:9px}
    .mass-label{font-size:12px;font-weight:650;color:#3b475c;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .mass-label span.hint{font-weight:400;color:#93a0b3;font-size:11px}
    .mass-target-modes{display:flex;flex-wrap:wrap;gap:7px}
    .mass-chip{padding:7px 12px;border-radius:20px;background:#eaf1ff;color:#285fc8;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent}
    .mass-chip:hover{background:#dce8ff}
    .mass-chip.active{background:#3478f6;color:#fff}
    .mass-group-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
    .mass-group-row select{max-width:220px}
    .mass-textarea{min-height:80px;font-size:13px}
    .mass-toolrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .mass-toolrow button{padding:7px 11px;font-size:11px}
    .mass-var{background:#f3eefe;color:#6b46b5}
    .mass-var:hover{background:#e9e0fc}
    .mass-rows{display:flex;flex-direction:column;gap:9px;max-height:340px;overflow:auto;padding:2px;border:1px solid #e8edf4;border-radius:12px;background:#f8fafd}
    .mass-row{display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px;border:1px solid #e3e8f0;border-radius:10px;background:#fff}
    .mass-row.selected{border-color:#3478f6;box-shadow:0 0 0 2px #3478f61a}
    .mass-row.skipped{opacity:.55}
    .mass-row-info{min-width:0}
    .mass-row-name{font-size:12px;font-weight:600;overflow-wrap:anywhere}
    .mass-row-meta{font-size:10px;color:#93a0b3;margin-top:3px;overflow-wrap:anywhere}
    .mass-row-check{display:flex;align-items:center;gap:5px;font-size:11px;color:#5c6880;margin-top:6px;cursor:pointer}
    .mass-row-check input{width:auto;accent-color:#3478f6}
    .mass-row textarea{min-height:62px;font-size:12px;resize:vertical}
    .mass-row-tag{grid-column:1/-1;font-size:10px;color:#7f6bb0;background:#f3eefe;border-radius:6px;padding:4px 8px;justify-self:start}
    .mass-preview{font-size:12px;color:#40506b;background:#f8fafd;border:1px solid #e8edf4;border-radius:8px;padding:9px 11px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:20px}
    .mass-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-top:1px solid #edf0f5;flex-wrap:wrap}
    .mass-summary{font-size:12px;color:#5c6880}
    .mass-actions{display:flex;gap:9px;align-items:center}
    .mass-send{background:#7a4fd6}
    .mass-send:hover{background:#6840bd}
    .mass-results{margin-top:4px;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
    .mass-result{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;font-size:12px;border:1px solid #e3e8f0}
    .mass-result.ok{background:#f0faf5;border-color:#cdebdc}
    .mass-result.fail{background:#fff3f3;border-color:#f3d0d0}
    .mass-result .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
    .mass-result.ok .dot{background:#1d9e75}
    .mass-result.fail .dot{background:#e24b4a}
    .mass-result .rname{font-weight:600;min-width:90px;overflow-wrap:anywhere}
    .mass-result .rerr{color:#a33;flex:1;overflow-wrap:anywhere}
    @media(max-width:720px){.modal-backdrop{padding:12px 8px}.mass-body{padding:14px;gap:14px}.mass-row{grid-template-columns:1fr}.mass-footer{padding:14px}.mass-head{padding:14px}}
    .error{color:#bf3e3e!important}
    @media(max-width:1100px){.workspace.has-devices{grid-template-columns:1fr}.device-items{flex-direction:row;max-height:none;overflow-x:auto;padding-bottom:3px}.device-item{flex:0 0 var(--preview-size,145px)}.device-preview{aspect-ratio:9/11}.device-list-summary{display:none}.card{grid-template-columns:minmax(0,1fr) 290px;grid-template-rows:auto auto}}
    @media(max-width:760px){header{position:static;align-items:flex-start;padding:12px 16px}.brand-mark{width:34px;height:34px}.header-actions{gap:6px}.header-actions button{padding:8px;font-size:11px}main{padding:18px 12px 28px}.toolbar{margin-bottom:12px}.workspace,.workspace.has-devices{gap:12px}.card{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;grid-template-areas:"head" "screen" "side";padding:12px;gap:12px}.screen-wrap{width:min(100%,calc((100vh - 320px)*9/16))}.device-list{padding:11px}.device-items{gap:8px}.device-item{flex-basis:min(var(--preview-size,125px),45vw)}.device-preview{aspect-ratio:9/10}}
    @media(max-width:480px){header{flex-wrap:wrap;gap:10px}.brand{gap:8px}.brand-mark{width:32px;height:32px}.header-actions{width:100%}.header-actions button{flex:1}.toolbar{align-items:flex-start}.card-head{align-items:flex-start;flex-direction:column}.meta{font-size:10px}.badge{align-self:flex-start}.system-actions{grid-template-columns:repeat(3,minmax(0,1fr))}.settings{grid-template-columns:1fr}.settings .appium-url,.settings .save{grid-column:auto}.clipboard{grid-template-columns:minmax(0,1fr) auto auto}.composer{grid-template-columns:minmax(0,1fr) auto}}
  </style>

<body>
  <header>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">海</div>
      <div><h1>海涛中控 v0.1</h1><p>设备管理工作台</p></div>
    </div>
    <div class="header-actions">
      <button id="mass-send-toggle" class="secondary" aria-pressed="false" disabled>差异化群发</button>
      <button id="all-devices-toggle" class="secondary" aria-pressed="false" disabled>控制所有手机</button>
      <button id="preview-live-toggle" class="secondary active" aria-pressed="true">小窗实时预览</button>
      <button id="refresh">刷新设备</button>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <span id="notice" role="status">正在查找已连接设备…</span>
      <span id="last-refresh"></span>
    </div>
    <div class="workspace">
      <div id="devices" class="grid"></div>
      <aside id="device-list" class="device-list" aria-label="设备列表"></aside>
    </div>
  </main>
  <div id="mass-backdrop" class="modal-backdrop" hidden role="dialog" aria-modal="true" aria-label="差异化群发">
    <div class="mass-panel">
      <div class="mass-head">
        <div><h2>差异化群发</h2><p>为每台手机发送不同内容；未单独填写的设备使用默认内容</p></div>
        <button id="mass-close" class="mass-close">关闭</button>
      </div>
      <div class="mass-body">
        <div class="mass-section">
          <div class="mass-label">目标设备 <span class="hint">可按需选择参与本次群发的设备</span></div>
          <div class="mass-target-modes" id="mass-target-modes">
            <button class="mass-chip active" data-mode="all">全部已连接</button>
            <button class="mass-chip" data-mode="group">按分组</button>
            <button class="mass-chip" data-mode="custom">手动选择</button>
          </div>
          <div class="mass-group-row" id="mass-group-row" hidden>
            <select id="mass-group-select" aria-label="选择分组"></select>
            <span class="hint" id="mass-group-count"></span>
          </div>
        </div>
        <div class="mass-section">
          <div class="mass-label">默认内容 <span class="hint">作为模板，未填写独立内容的设备将使用此内容</span></div>
          <textarea id="mass-default" class="mass-textarea" placeholder="输入默认文本，例如：你好，{{name}}，这是第 {{index}} 台设备"></textarea>
          <div class="mass-toolrow">
            <button class="mass-var secondary" data-var="{{name}}">插入设备名</button>
            <button class="mass-var secondary" data-var="{{index}}">插入序号</button>
            <button class="mass-var secondary" data-var="{{udid}}">插入 UDID</button>
            <span class="hint">变量会在发送前替换为每台设备的实际值</span>
          </div>
        </div>
        <div class="mass-section">
          <div class="mass-label">逐台内容 <span class="hint">每台可单独改写；勾选“使用默认”则跟随模板</span></div>
          <div class="mass-toolrow">
            <button id="mass-fill-lines" class="secondary">按行批量填充</button>
            <button id="mass-fill-default" class="secondary">全部填入默认内容</button>
            <button id="mass-clear-custom" class="secondary">清除独立内容</button>
          </div>
          <div id="mass-rows" class="mass-rows"></div>
        </div>
        <div class="mass-section" id="mass-result-section" hidden>
          <div class="mass-label">发送结果</div>
          <div id="mass-results" class="mass-results"></div>
        </div>
      </div>
      <div class="mass-footer">
        <div class="mass-summary" id="mass-summary">已选择 0 台设备</div>
        <div class="mass-actions">
          <span class="message" id="mass-message"></span>
          <button id="mass-send" class="mass-send">开始群发</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    const COMMON_APPS = [
      {name:"微信",id:"com.tencent.xin"},{name:"抖音",id:"com.ss.iphone.ugc.Aweme"},
      {name:"小红书",id:"com.xingin.discover"},{name:"快手",id:"com.qiangjia.gif"},
      {name:"淘宝",id:"com.taobao.taobao4iphone"},{name:"京东",id:"com.360buy.jdmobile"},
      {name:"闲鱼",id:"com.taobao.fleamarket"},{name:"QQ",id:"com.tencent.mqq"},
      {name:"支付宝",id:"com.alipay.ipaynow"},{name:"设置",id:"com.apple.Preferences"},
      {name:"Safari 浏览器",id:"com.apple.mobilesafari"},{name:"备忘录",id:"com.apple.mobilenotes"}
    ];
    const root = document.getElementById("devices");
    const notice = document.getElementById("notice");
    const lastRefresh = document.getElementById("last-refresh");
    const deviceList = document.getElementById("device-list");
    let devices = [];
    let selectedUDID = "";
    const typeInputText = new Map();
    const streaming = new Set();
    const previewImages = new Map();
    const previewRetryAfter = new Map();
    const previewRefreshedAt = new Map();
    const previewInFlight = new Set();
    const previewToggle = document.getElementById("preview-live-toggle");
    const PREVIEW_REFRESH_MS = 1500;
    const PREVIEW_TIMEOUT_MS = 8000;
    let previewLiveEnabled = true;
    let previewSize = 220;
    const streamRetryTimers = new Map();
    const streamAttempts = new Map();
    const streamStoppedByUser = new Set();
    const autoConnectAttempts = new Map();
    let refreshingDevices = false;
    let deviceListDrawn = false;
    let connectingAllDevices = false;
    let allDevicesControl = false;
    let sessionRecoveryScheduled = false;

    async function request(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {"Content-Type":"application/json", ...(options.headers || {})}
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (response.status === 409) {
          const match = String(path).match(/^\/api\/devices\/([^/]+)\//);
          if (match) handleSessionLost(decodeURIComponent(match[1]));
        }
        const error = new Error(data.error || `请求失败 (${response.status})`);
        error.code = data.code || "";
        error.status = response.status;
        throw error;
      }
      return data;
    }

    async function mapLimit(items, limit, fn) {
      const results = new Array(items.length);
      let cursor = 0;
      const workers = Array.from({length: Math.min(limit, items.length)}, async () => {
        while (true) {
          const index = cursor++;
          if (index >= items.length) return;
          try {
            results[index] = {status:"fulfilled", value: await fn(items[index])};
          } catch (error) {
            results[index] = {status:"rejected", reason:error};
          }
        }
      });
      await Promise.all(workers);
      return results;
    }

    function esc(value) {
      return String(value || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }

    async function refreshDevices() {
      if (refreshingDevices || connectingAllDevices) return;
      refreshingDevices = true;
      notice.textContent = "正在查找已连接设备…";
      notice.className = "";
      try {
        const result = await request("/api/devices");
        const previousUDIDs = new Set(devices.map(d => d.udid));
        const old = new Map(devices.map(d => [d.udid, d]));
        let deviceListChanged = !deviceListDrawn || devices.length !== result.devices.length;
        const nextDevices = result.devices.map((d, index) => {
          const previous = old.get(d.udid);
          const next = {
            ...d,
            name: previous?.name ?? d.name,
            group: previous?.group ?? d.group,
            appiumUrl: previous?.appiumUrl ?? d.appiumUrl,
          };
          if (!previous) {
            deviceListChanged = true;
          } else {
            if (previous.sessionId !== next.sessionId) {
              streaming.delete(d.udid);
              previewImages.delete(d.udid);
              previewRetryAfter.delete(d.udid);
              previewRefreshedAt.delete(d.udid);
              previewInFlight.delete(d.udid);
              clearStreamRetry(d.udid);
              streamAttempts.delete(d.udid);
            }
            if (["connectionType", "name", "group", "appiumUrl", "sessionId", "sessionType"]
              .some(key => previous[key] !== next[key])) {
              deviceListChanged = true;
            }
            if (devices[index]?.udid !== d.udid) deviceListChanged = true;
            Object.assign(previous, next);
            return previous;
          }
          return next;
        });
        devices = nextDevices;
        const addedDevices = nextDevices.filter(d => !previousUDIDs.has(d.udid));
        for (const udid of previewImages.keys()) {
          if (!devices.some(d => d.udid === udid)) {
            previewImages.delete(udid);
            previewRetryAfter.delete(udid);
            previewRefreshedAt.delete(udid);
            previewInFlight.delete(udid);
            clearStreamRetry(udid);
            streamAttempts.delete(udid);
            autoConnectAttempts.delete(udid);
            streamStoppedByUser.delete(udid);
          }
        }
        const previousSelectedUDID = selectedUDID;
        if (!devices.some(d => d.udid === selectedUDID)) {
          selectedUDID = (devices.find(d => d.sessionId) || devices[0] || {}).udid || "";
        }
        if (addedDevices.length && !devices.find(d => d.udid === selectedUDID)?.sessionId) {
          selectedUDID = addedDevices[0].udid;
        }
        if (previousSelectedUDID !== selectedUDID) deviceListChanged = true;
        const allControlWasReset = allDevicesControl && devices.some(d => !d.sessionId);
        if (allControlWasReset) {
          allDevicesControl = false;
        }
        updateAllDevicesButton();
        notice.textContent = allControlWasReset
          ? "设备会话变化，全设备控制已关闭"
          : devices.length ? `发现 ${devices.length} 台设备` : "尚未发现 iPhone，请检查 USB 连接、驱动与设备信任状态";
        if (deviceListChanged) drawDevices();
        lastRefresh.textContent = new Date().toLocaleTimeString();
        await ensureSelectedDeviceReady();
        refreshDevicePreviews();
      } catch (error) {
        notice.textContent = error.message;
        notice.className = "error";
        root.innerHTML = `<div class="empty error">${esc(error.message)}<br><br>请确认设备已通过 USB 连接，并且 Windows usbmuxd 服务可用。</div>`;
        deviceListDrawn = false;
      } finally {
        refreshingDevices = false;
      }
    }

    async function ensureSelectedDeviceReady() {
      if (!devices.length) return;
      let device = devices.find(d => d.udid === selectedUDID);
      if (!device) {
        device = devices.find(d => d.sessionId) || devices[0];
        selectedUDID = device.udid;
        drawDevices();
      }
      if (device.sessionId) {
        if (!streaming.has(device.udid) && !streamStoppedByUser.has(device.udid) &&
            (streamAttempts.get(device.udid) || 0) < 6) {
          const card = root.querySelector(`[data-udid="${CSS.escape(device.udid)}"]`);
          if (card) await toggleStream(card, device, true);
        }
        return;
      }

      const now = Date.now();
      if (now - (autoConnectAttempts.get(device.udid) || 0) < 15000) return;
      autoConnectAttempts.set(device.udid, now);

      const card = root.querySelector(`[data-udid="${CSS.escape(device.udid)}"]`);
      if (!card) return;
      const button = card.querySelector(".connect");
      if (button) {
        button.disabled = true;
        button.textContent = "正在连接并投屏…";
      }
      notice.className = "";
      notice.textContent = `正在自动连接并开启投屏：${device.name || "iPhone"}…`;
      try {
        await connectDevice(device);
        autoConnectAttempts.delete(device.udid);
        drawDevices();
        const connectedCard = root.querySelector(`[data-udid="${CSS.escape(device.udid)}"]`);
        if (connectedCard && !streamStoppedByUser.has(device.udid)) {
          await toggleStream(connectedCard, device, true);
        }
        notice.textContent = `已自动连接并开启投屏：${device.name || "iPhone"}`;
      } catch (error) {
        notice.textContent = `自动连接失败：${error.message}`;
        notice.className = "error";
        if (card) toast(card, error.message, true);
      } finally {
        if (button && button.isConnected) {
          button.disabled = false;
          button.textContent = "连接设备";
        }
      }
    }

    async function connectDevice(device) {
      const result = await request(`/api/devices/${encodeURIComponent(device.udid)}/session`, {method:"POST",body:"{}"});
      device.sessionId = result.sessionId;
      device.sessionType = result.sessionType;
    }

    async function toggleAllDevicesControl() {
      if (allDevicesControl) {
        allDevicesControl = false;
        updateAllDevicesButton();
        notice.textContent = "已关闭全设备控制，现在只控制当前手机";
        return;
      }
      if (devices.length < 2 || connectingAllDevices) return;

      connectingAllDevices = true;
      updateAllDevicesButton();
      const pending = devices.filter(d => !d.sessionId);
      let completed = 0;
      try {
        const results = await mapLimit(pending, 3, async device => {
          notice.textContent = `正在连接所有手机（${completed + 1}/${pending.length}）：${device.name || "iPhone"}…`;
          try {
            await connectDevice(device);
          } finally {
            completed++;
            notice.textContent = `正在连接所有手机（${completed}/${pending.length}）…`;
          }
        });
        const failures = results.flatMap((result, index) => result.status === "rejected"
          ? [`${pending[index].name || "iPhone"}：${result.reason?.message || result.reason}`]
          : []);
        drawDevices();
        if (failures.length) {
          allDevicesControl = false;
          notice.textContent = `无法连接全部手机，全设备控制未开启：${failures.join("；")}`;
          notice.className = "error";
          return;
        }
        allDevicesControl = true;
        notice.textContent = `已开启全设备控制（${devices.length} 台）`;
        notice.className = "";
      } finally {
        connectingAllDevices = false;
        updateAllDevicesButton();
      }
    }

    function updateAllDevicesButton() {
      const button = document.getElementById("all-devices-toggle");
      button.disabled = devices.length < 2 || connectingAllDevices;
      const massButton = document.getElementById("mass-send-toggle");
      if (massButton) massButton.disabled = massConnectedDevices().length === 0;
      button.setAttribute("aria-pressed", String(allDevicesControl));
      button.classList.toggle("active", allDevicesControl);
      button.textContent = connectingAllDevices
        ? "正在连接所有手机…"
        : allDevicesControl ? "关闭全设备控制" : "控制所有手机";
    }

    async function requestToControlledDevices(device, endpoint, options) {
      const recipients = controlledDevices(device);
      if (!recipients.length) throw new Error("没有可控制的手机");
      if (recipients.length === 1) {
        await request(`/api/devices/${encodeURIComponent(recipients[0].udid)}/${endpoint}`, options);
        return recipients;
      }

      const payload = typeof options.body === "string" ? JSON.parse(options.body) : (options.body || {});
      const result = await request("/api/batch", {
        method: "POST",
        body: JSON.stringify({
          udids: recipients.map(target => target.udid),
          operation: endpoint,
          body: payload
        })
      });
      const failures = result.results.filter(item => !item.ok);
      for (const failure of failures) {
        if (failure.code === "session_lost" || failure.code === "session_required") {
          handleSessionLost(failure.udid);
        }
      }
      if (failures.length) {
        const details = failures.map(item => `${item.name || item.udid}（${item.code || "error"}）：${item.error || "失败"}`).join("；");
        throw new Error(`成功 ${result.succeeded}/${result.total} 台；失败：${details}`);
      }
      return recipients;
    }

    function controlledDevices(device) {
      return allDevicesControl ? devices.filter(target => target.sessionId) : [device];
    }

      const selectionEnd = preserveTypeFocus ? activeTypeInput.selectionEnd : null;

      deviceListDrawn = true;
      drawDeviceList();

        root.innerHTML = '<div class="empty">连接 iPhone 后点击“刷新设备”。</div>';
        return;
      }
      const selectedDevice = devices.find(d => d.udid === selectedUDID);
      if (!selectedDevice) {
        root.innerHTML = '<div class="empty">请选择要控制的 iPhone。</div>';
        return;
      }
      root.innerHTML = devices.filter(d => d.udid === selectedUDID).map(d => `
        <article class="card" data-udid="${esc(d.udid)}">

          </div>
          <div class="side-panel">
            <section class="panel-section">
              <div class="section-title">设备控制</div>
              <div class="control-rail">
                <div class="connection-actions">
                  <button class="connect">${d.sessionId ? "断开会话" : "连接设备"}</button>
                  <button class="screenshot secondary" ${d.sessionId ? "" : "disabled"}>${streaming.has(d.udid) ? "停止投屏" : "开始投屏"}</button>
                </div>
                <div class="system-actions">
                  <button class="home secondary" ${d.sessionId ? "" : "disabled"}>主屏幕</button>
                  <button class="lock secondary" ${d.sessionId ? "" : "disabled"}>锁屏</button>
                  <button class="unlock secondary" ${d.sessionId ? "" : "disabled"}>解锁</button>
                  <button class="portrait secondary" ${d.sessionId ? "" : "disabled"}>竖屏</button>
                  <button class="landscape secondary" ${d.sessionId ? "" : "disabled"}>横屏</button>
                  <button class="messages secondary" ${d.sessionId ? "" : "disabled"}>未读数</button>
                  <button class="volume-up secondary" ${d.sessionId ? "" : "disabled"}>音量 +</button>
                  <button class="volume-down secondary" ${d.sessionId ? "" : "disabled"}>音量 −</button>
                  <button class="reboot danger" ${d.sessionId && d.sessionType !== "WDA" ? "" : "disabled"} title="${d.sessionType === "WDA" ? "WDA 直连模式不支持重启" : ""}">重启</button>
                </div>
              </div>
            </section>
            <section class="panel-section">
              <div class="section-title">文本输入</div>
              <div class="composer">
                <input class="type-text" value="${esc(typeInputText.get(d.udid) || "")}" placeholder="先在手机上聚焦文本框，再输入；Enter 发送">
                <button class="type" ${d.sessionId ? "" : "disabled"}>发送</button>
                <button class="type-enter secondary" ${d.sessionId ? "" : "disabled"} title="向手机发送回车键，常用于提交输入内容">回车键</button>
                <span class="message"></span>
              </div>
            </section>
            <section class="panel-section">
              <div class="section-title">设备信息</div>
              <div class="settings">
                <input class="device-name" aria-label="设备名称" value="${esc(d.name)}" placeholder="设备名称">
                <input class="device-group" aria-label="设备分组" value="${esc(d.group)}" placeholder="分组名称">
                <input class="appium-url" aria-label="Appium 地址" value="${esc(d.appiumUrl)}" placeholder="http://127.0.0.1:4723">
                <button class="save secondary">保存设备信息</button>
              </div>

            <section class="panel-section">
              <div class="section-title">应用</div>
              <div class="app-tools">
                <select class="app-bundle" aria-label="选择应用">
                  ${COMMON_APPS.map(app => `<option value="${esc(app.id)}">${esc(app.name)}</option>`).join("")}

                <input class="app-bundle-custom" aria-label="自定义 Bundle ID" placeholder="或输入 Bundle ID">

      devices.filter(d => d.udid === selectedUDID).forEach(device => {

        if (streaming.has(device.udid) && device.sessionId) {
          const card = root.querySelector(`[data-udid="${CSS.escape(device.udid)}"]`);
          const img = card.querySelector(".screen");
          img.src = `/api/devices/${encodeURIComponent(device.udid)}/stream`;

        if (typeInput) {
          typeInput.focus({preventScroll:true});
          typeInput.setSelectionRange(selectionStart, selectionEnd);

    }

    function drawDeviceList() {
      const connectedCount = devices.filter(d => d.sessionId).length;
      const otherDevices = devices.filter(d => d.udid !== selectedUDID);
      const groupMap = new Map();
      for (const d of otherDevices) {
        const key = d.group || "未分组";
        if (!groupMap.has(key)) groupMap.set(key, []);
        groupMap.get(key).push(d);
      }
      const groupedList = [...groupMap.entries()].map(([group, members]) => `
        <div class="device-group-head"><span>${esc(group)}</span><span class="gap">${members.length} 台</span></div>` +
        members.map(d => `
          <div class="device-item ${d.udid === selectedUDID ? "current" : ""}" data-udid="${esc(d.udid)}" role="button" tabindex="0" aria-label="切换到 ${esc(d.name || "iPhone")}">
            <div class="device-preview">
              ${d.sessionId
                ? `<img class="device-thumb" data-udid="${esc(d.udid)}" alt="${esc(d.name || "iPhone")} 屏幕预览">`
                : '<div class="device-thumb-placeholder">未连接</div>'}
              <span class="device-preview-status ${previewLiveEnabled && d.sessionId && d.udid !== selectedUDID && (previewRetryAfter.get(d.udid) || 0) <= Date.now() && previewImages.has(d.udid) ? "live" : ""}">${d.udid === selectedUDID ? "主控" : !d.sessionId ? "未连接" : !previewLiveEnabled ? "已暂停" : (previewRetryAfter.get(d.udid) || 0) > Date.now() ? "预览失败" : previewImages.has(d.udid) ? "实时" : "已连接"}</span>
            </div>
            <div class="device-item-footer">
              <div>
                <div class="device-item-name">${esc(d.name || "iPhone")}</div>
                <div class="device-item-meta">${esc(d.group || "未分组")} · ${esc(d.connectionType || "USB")}</div>
              </div>
              <div class="device-item-actions">
                ${d.udid === selectedUDID
                  ? '<span class="device-master">主控</span>'
                  : d.sessionId
                    ? '<span class="device-master">点击切换</span>'
                    : `<button class="connect-target secondary" data-udid="${esc(d.udid)}">连接</button>`}
              </div>
            </div>
          </div>`).join("")).join("");
      deviceList.hidden = devices.length < 2;
      deviceList.parentElement.classList.toggle("has-devices", devices.length > 1);
      deviceList.innerHTML = `
        <div class="device-list-head"><strong>设备列表</strong><span class="device-list-count">${connectedCount}/${devices.length} 已连接</span></div>
        <div class="preview-size-control">
          <label for="preview-size">小窗大小</label>
          <input id="preview-size" type="range" min="140" max="320" step="10" value="${previewSize}" aria-label="调整小窗大小">
          <span id="preview-size-value">${previewSize}px</span>
        </div>
        <div class="device-list-summary">点击小窗切换大屏主控；开启“控制所有手机”可同步操作。</div>
        <div class="device-items">${groupedList || '<div class="empty">当前主控已显示在大屏</div>'}</div>`;

      deviceList.querySelectorAll(".device-thumb").forEach(img => {
        const preview = previewImages.get(img.dataset.udid);
        if (preview) img.src = preview;
      });
      deviceList.querySelectorAll(".device-item").forEach(item => {
        const select = () => selectDevice(item.dataset.udid);
        item.addEventListener("click", event => {
          if (event.target.closest("button,label,input")) return;
          select();
        });
        item.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            select();
          }
        });
      });
      deviceList.querySelectorAll(".connect-target").forEach(button => {
        button.addEventListener("click", async () => {
          const target = devices.find(d => d.udid === button.dataset.udid);
          const card = root.querySelector(`[data-udid="${CSS.escape(selectedUDID)}"]`);
          if (!target || !card) return;
          button.disabled = true;
          await run(card, async () => {
            await connectDevice(target);
            drawDevices();
          });
          if (button.isConnected) button.disabled = false;
        });
      });
    }

    function selectDevice(udid) {
      if (udid === selectedUDID) return;
      selectedUDID = udid;
      drawDevices();
      const device = devices.find(d => d.udid === udid);
      if (!device) return;
      if (!device.sessionId) {
        notice.textContent = `已切换到 ${device.name || "iPhone"}，正在连接…`;
        ensureSelectedDeviceReady();
        return;
      }
      notice.textContent = `已切换到 ${device.name || "iPhone"}`;
      refreshDevicePreviews();
      if (!streaming.has(udid)) {
        const card = root.querySelector(`[data-udid="${CSS.escape(udid)}"]`);
        if (card) toggleStream(card, device);
      }
    }

    function refreshDevicePreviews() {
      if (!previewLiveEnabled || connectingAllDevices || document.hidden) return;
      const now = Date.now();
      devices.forEach(device => {
        if (!device.sessionId || device.udid === selectedUDID) return;
        if ((previewRetryAfter.get(device.udid) || 0) > now || previewInFlight.has(device.udid)) return;
        previewInFlight.add(device.udid);
        refreshSinglePreview(device, now).finally(() => previewInFlight.delete(device.udid));
      });
    }

    async function refreshSinglePreview(device, now) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), PREVIEW_TIMEOUT_MS);
      try {
        const result = await request(
          `/api/devices/${encodeURIComponent(device.udid)}/screenshot?preview=1&ts=${now}`,
          {signal: controller.signal}
        );
        const image = `data:${result.mime || "image/png"};base64,${result.image}`;
        previewImages.set(device.udid, image);
        previewRetryAfter.delete(device.udid);
        const refreshedAt = Date.now();
        previewRefreshedAt.set(device.udid, refreshedAt);
        const img = deviceList.querySelector(`.device-thumb[data-udid="${CSS.escape(device.udid)}"]`);
        if (img) img.src = image;
        const status = deviceList.querySelector(`.device-item[data-udid="${CSS.escape(device.udid)}"] .device-preview-status`);
        if (status) {
          status.textContent = "实时";
          status.classList.add("live");
          status.title = `最后刷新 ${new Date(refreshedAt).toLocaleTimeString()}`;
        }
      } catch (error) {
        previewRetryAfter.set(device.udid, Date.now() + 15000);
        const status = deviceList.querySelector(`.device-item[data-udid="${CSS.escape(device.udid)}"] .device-preview-status`);
        if (status) {
          status.classList.remove("live");
          status.textContent = error?.name === "AbortError" ? "预览超时" : "预览失败";
          status.title = error?.message || String(error);
        }
      } finally {
        clearTimeout(timeout);
      }
    }

    function updatePreviewToggle() {
      previewToggle.textContent = previewLiveEnabled ? "小窗实时预览" : "小窗预览已暂停";
      previewToggle.classList.toggle("active", previewLiveEnabled);
      previewToggle.setAttribute("aria-pressed", String(previewLiveEnabled));
      if (previewLiveEnabled) {
        refreshDevicePreviews();
        return;
      }
      deviceList.querySelectorAll(".device-preview-status").forEach(status => {
        status.classList.remove("live");
        if (status.textContent !== "主控") status.textContent = "已暂停";
        status.title = "小窗实时预览已暂停";
      });
    }

    function applyPreviewSize(value, persist = false) {
      const size = Math.min(320, Math.max(140, Number(value) || 220));
      previewSize = size;
      document.documentElement.style.setProperty("--preview-size", `${size}px`);
      const slider = document.getElementById("preview-size");
      if (slider) slider.value = String(size);
      const label = document.getElementById("preview-size-value");
      if (label) label.textContent = `${size}px`;
      if (persist) {
        try { localStorage.setItem("previewSize", String(size)); } catch (_) { /* storage may be unavailable */ }
      }
    }

    function bindCard(device) {
      const card = root.querySelector(`[data-udid="${CSS.escape(device.udid)}"]`);
      const field = selector => card.querySelector(selector);
      field(".device-name").addEventListener("input", e => device.name = e.target.value);
      field(".device-group").addEventListener("input", e => device.group = e.target.value);
      field(".appium-url").addEventListener("input", e => device.appiumUrl = e.target.value);
      field(".save").onclick = () => run(card, async () => {
        await request(`/api/devices/${encodeURIComponent(device.udid)}/settings`, {method:"POST",body:JSON.stringify({name:device.name,group:device.group,appiumUrl:device.appiumUrl})});
        toast(card, "配置已保存");
      });
      field(".connect").onclick = () => run(card, async () => {
        if (device.sessionId) {
          if (allDevicesControl) {
            allDevicesControl = false;
            updateAllDevicesButton();
            notice.textContent = "设备断开，全设备控制已关闭";
          }
          await request(`/api/devices/${encodeURIComponent(device.udid)}/session`, {method:"DELETE"});
          device.sessionId = "";
        } else {
          await connectDevice(device);
        }
        drawDevices();
      });
      field(".screenshot").onclick = () => toggleStream(card, device);
      field(".messages").onclick = () => run(card, async () => {
        const result = await request(`/api/devices/${encodeURIComponent(device.udid)}/messages`);
        toast(card, result.app ? `${result.app} 未读：${result.unread}` : `未读：${result.unread}`);
      });
      for (const [action, selector] of [["lock","lock"],["unlock","unlock"],["home","home"],["reboot","reboot"],["volumeUp","volume-up"],["volumeDown","volume-down"]]) {
        field(`.${selector}`).onclick = () => run(card, async () => {
          const targets = controlledDevices(device);
          const confirmation = targets.length
            ? `确认同时重启 ${targets.length} 台手机？`
            : "确认重启这台 iPhone？";
          if (action === "reboot" && !confirm(confirmation)) return;
          const recipients = await requestToControlledDevices(device, "actions", {method:"POST",body:JSON.stringify({action})});
          toast(card, recipients.length > 1 ? `操作已同步到 ${recipients.length - 1} 台手机` : "操作已发送");
        });
      }
      field(".portrait").onclick = () => sendAction(card, device, "orientation", "PORTRAIT");
      field(".landscape").onclick = () => sendAction(card, device, "orientation", "LANDSCAPE");
      const typeField = field(".type-text");
      typeField.addEventListener("input", event => typeInputText.set(device.udid, event.target.value));
      const submitText = () => run(card, async () => {
        const recipients = await requestToControlledDevices(device, "type", {method:"POST",body:JSON.stringify({text:typeField.value})});
        toast(card, recipients.length > 1 ? `文本已同步到 ${recipients.length} 台手机` : "文本已输入");
      });
      typeField.addEventListener("keydown", event => {
        if (event.key !== "Enter" || event.shiftKey || event.isComposing || event.keyCode === 229) return;
        event.preventDefault();
        submitText();
      });
      field(".type").onclick = submitText;
      field(".type-enter").onclick = () => sendAction(card, device, "enter");
      field(".clipboard-set").onclick = () => run(card, async () => {
        const recipients = await requestToControlledDevices(device, "clipboard", {method:"PUT",body:JSON.stringify({text:field(".clipboard-text").value})});
        toast(card, recipients.length > 1 ? `剪贴板已同步到 ${recipients.length} 台手机` : "剪贴板已写入");
      });
      field(".clipboard-get").onclick = () => run(card, async () => {
        const result = await request(`/api/devices/${encodeURIComponent(device.udid)}/clipboard`);
        field(".clipboard-text").value = result.value || "";
        toast(card, "已读取手机剪贴板");
      });
      const resolveBundle = () => {
        const custom = field(".app-bundle-custom").value.trim();
        return custom || field(".app-bundle").value;
      };
      field(".app-open").onclick = () => run(card, async () => {
        const bundleId = resolveBundle();
        if (!bundleId) throw new Error("请选择或输入应用 Bundle ID");
        await request(`/api/devices/${encodeURIComponent(device.udid)}/app`, {method:"POST",body:JSON.stringify({action:"open",bundleId})});
        toast(card, `已尝试打开 ${bundleId}`);
      });
      field(".app-uninstall").onclick = () => run(card, async () => {
        if (device.sessionType === "WDA") throw new Error("WDA 直连模式不支持卸载，请切换到 Appium 会话");
        const bundleId = resolveBundle();
        if (!bundleId) throw new Error("请选择或输入应用 Bundle ID");
        if (!confirm(`确认卸载 ${bundleId}？此操作不可撤销。`)) return;
        await request(`/api/devices/${encodeURIComponent(device.udid)}/app`, {method:"POST",body:JSON.stringify({action:"uninstall",bundleId})});
        toast(card, `已卸载 ${bundleId}`);
      });
      bindScreen(card, device);
    }

    async function sendAction(card, device, action, orientation) {
      await run(card, async () => {
        const recipients = await requestToControlledDevices(device, "actions", {method:"POST",body:JSON.stringify({action,orientation})});
        toast(card, recipients.length > 1 ? `操作已同步到 ${recipients.length} 台手机` : "操作已发送");
      });
    }

    function clearStreamRetry(udid) {
      const timer = streamRetryTimers.get(udid);
      if (timer) clearTimeout(timer);
      streamRetryTimers.delete(udid);
    }

    function scheduleStreamRetry(card, device) {
      if (!device.sessionId || streamStoppedByUser.has(device.udid) || streamRetryTimers.has(device.udid)) return;
      const attempts = (streamAttempts.get(device.udid) || 0) + 1;
      streamAttempts.set(device.udid, attempts);
      if (attempts > 5) {
        toast(card, "投屏多次重连失败，请检查设备后重新连接", true);
        return;
      }
      const delay = Math.min(1000 * 2 ** (attempts - 1), 8000);
      const timer = setTimeout(() => {
        streamRetryTimers.delete(device.udid);
        if (!device.sessionId || streamStoppedByUser.has(device.udid) || streaming.has(device.udid)) return;
        const current = root.querySelector(`[data-udid="${CSS.escape(device.udid)}"]`);
        if (current) toggleStream(current, device, true);
      }, delay);
      streamRetryTimers.set(device.udid, timer);
    }

    function handleSessionLost(udid) {
      const device = devices.find(d => d.udid === udid);
      if (device) {
        device.sessionId = "";
        device.sessionType = "";
      }
      streaming.delete(udid);
      clearStreamRetry(udid);
      streamAttempts.delete(udid);
      if (sessionRecoveryScheduled) return;
      sessionRecoveryScheduled = true;
      notice.className = "";
      notice.textContent = "设备会话已失效，正在重新连接…";
      setTimeout(() => {
        sessionRecoveryScheduled = false;
        if (refreshingDevices) {
          setTimeout(refreshDevices, 1000);
          return;
        }
        refreshDevices();
      }, 1200);
    }

    async function updateScreenshot(card, device) {
      const img = card.querySelector(".screen");
      img.src = `/api/devices/${encodeURIComponent(device.udid)}/stream?ts=${Date.now()}`;
      img.hidden = false;
      card.querySelector(".screen-placeholder").hidden = true;
    }

    async function toggleStream(card, device, auto = false) {
      await run(card, async () => {
        if (streaming.has(device.udid)) {
          streaming.delete(device.udid);
          streamStoppedByUser.add(device.udid);
          clearStreamRetry(device.udid);
          streamAttempts.delete(device.udid);
          card.querySelector(".screen").src = "";
          card.querySelector(".screen").hidden = true;
          card.querySelector(".screen-placeholder").hidden = false;
          card.querySelector(".screenshot").textContent = "开始投屏";
          toast(card, "实时画面已停止");
          return;
        }
        streamStoppedByUser.delete(device.udid);
        clearStreamRetry(device.udid);
        if (!auto) streamAttempts.delete(device.udid);
        await updateScreenshot(card, device);
        streaming.add(device.udid);
        card.querySelector(".screenshot").textContent = "停止投屏";
        toast(card, "实时 MJPEG 视频流已开启");
      });
    }

    function bindScreen(card, device) {
      const img = card.querySelector(".screen");
      img.addEventListener("dragstart", e => e.preventDefault());
      img.addEventListener("selectstart", e => e.preventDefault());
      img.addEventListener("load", () => streamAttempts.delete(device.udid));
      img.addEventListener("error", () => {
        if (!streaming.has(device.udid)) return;
        streaming.delete(device.udid);
        img.hidden = true;
        const placeholder = card.querySelector(".screen-placeholder");
        if (placeholder) {
          placeholder.hidden = false;
          placeholder.textContent = "投屏已断开，正在重试…";
        }
        const button = card.querySelector(".screenshot");
        if (button) button.textContent = "开始投屏";
        scheduleStreamRetry(card, device);
        setTimeout(refreshDevices, 1500);
      });
      let start;
      img.addEventListener("pointerdown", e => {
        if (e.button !== 0) return;
        if (img.hidden || !img.naturalWidth) return;
        e.preventDefault();
        img.setPointerCapture(e.pointerId);
        const rect = img.getBoundingClientRect();
        start = {x:e.clientX,y:e.clientY,px:(e.clientX-rect.left)*img.naturalWidth/rect.width,py:(e.clientY-rect.top)*img.naturalHeight/rect.height,imageWidth:img.naturalWidth,imageHeight:img.naturalHeight};
      });
      img.addEventListener("pointerup", e => {
        if (e.button !== 0) return;
        if (!start) return;
        const rect = img.getBoundingClientRect();
        const end = {x:(e.clientX-rect.left)*img.naturalWidth/rect.width,y:(e.clientY-rect.top)*img.naturalHeight/rect.height};
        const delta = Math.abs(e.clientX-start.x)+Math.abs(e.clientY-start.y);
        if (delta < 10) {
          run(card, () => requestToControlledDevices(device, "tap", {method:"POST",body:JSON.stringify({x:Math.round(start.px),y:Math.round(start.py),imageWidth:start.imageWidth,imageHeight:start.imageHeight})}));
        } else {
          run(card, () => requestToControlledDevices(device, "swipe", {method:"POST",body:JSON.stringify({x1:Math.round(start.px),y1:Math.round(start.py),x2:Math.round(end.x),y2:Math.round(end.y),imageWidth:start.imageWidth,imageHeight:start.imageHeight,durationMs:500})}));
        }
        start = null;
      });
      img.addEventListener("pointercancel", () => start = null);
      img.addEventListener("contextmenu", e => {
        e.preventDefault();
        start = null;
        run(card, async () => {
          const recipients = await requestToControlledDevices(device, "actions", {method:"POST",body:JSON.stringify({action:"home"})});
          toast(card, recipients.length > 1 ? `已同步返回主屏幕：${recipients.length} 台手机` : "已返回主屏幕");
        });
      });
    }

    async function run(card, callback) {
      const buttons = [...card.querySelectorAll("button")];
      buttons.forEach(button => button.disabled = true);
      try { await callback(); }
      catch (error) { toast(card, error.message, true); }
      finally {
        buttons.forEach(button => button.disabled = false);
        const connected = card.querySelector(".badge").textContent.includes("已连接");
        card.querySelectorAll(".screenshot,.messages,.lock,.unlock,.home,.reboot,.portrait,.landscape,.volume-up,.volume-down,.type,.type-enter,.clipboard-set,.clipboard-get,.app-open,.app-uninstall").forEach(button => button.disabled = !connected);
        if (connected && card.querySelector(".badge").textContent.startsWith("WDA")) card.querySelector(".reboot").disabled = true;
      }
    }

    function toast(card, message, error = false) {
      const node = card.querySelector(".message");
      node.textContent = message;
      node.className = `message${error ? " error" : ""}`;
      setTimeout(() => { if (node.textContent === message) node.textContent = ""; }, 5000);
    }

    // ===== 差异化群发 =====
    const massBackdrop = document.getElementById("mass-backdrop");
    const massRows = document.getElementById("mass-rows");
    const massDefault = document.getElementById("mass-default");
    const massSummary = document.getElementById("mass-summary");
    const massMessage = document.getElementById("mass-message");
    const massResults = document.getElementById("mass-results");
    const massResultSection = document.getElementById("mass-result-section");
    const massGroupSelect = document.getElementById("mass-group-select");
    const massGroupRow = document.getElementById("mass-group-row");
    const massGroupCount = document.getElementById("mass-group-count");
    let massMode = "all";
    let massGroup = "";
    // 每台设备的独立内容：{ [udid]: { text, useDefault } }
    const massEntries = new Map();

    function massConnectedDevices() {
      return devices.filter(d => d.sessionId);
    }

    function massTargetDevices() {
      const connected = massConnectedDevices();
      if (massMode === "group") {
        return massGroup ? connected.filter(d => d.group === massGroup) : [];
      }
      if (massMode === "custom") {
        return connected.filter(d => massEntries.has(d.udid) && massEntries.get(d.udid).selected !== false);
      }
      return connected;
    }

    function renderMassGroups() {
      const groups = [...new Set(massConnectedDevices().map(d => d.group).filter(Boolean))].sort();
      const current = massGroupSelect.value;
      massGroupSelect.innerHTML = groups.length
        ? `<option value="">未分组设备</option>` + groups.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join("")
        : '<option value="">（暂无分组）</option>';
      if (groups.includes(current) || current === "") massGroupSelect.value = current;
      if (!massGroup && groups.length) {
        massGroup = groups[0];
        massGroupSelect.value = massGroup;
      }
      updateMassGroupCount();
    }

    function updateMassGroupCount() {
      const count = massGroup ? massConnectedDevices().filter(d => d.group === massGroup).length : 0;
      massGroupCount.textContent = count ? `该组 ${count} 台已连接` : "";
    }

    function ensureMassEntry(udid) {
      if (!massEntries.has(udid)) {
        massEntries.set(udid, {text: "", useDefault: true, selected: true});
      }
      return massEntries.get(udid);
    }

    function renderMassRows() {
      const targets = massMode === "custom" ? massConnectedDevices() : massTargetDevices();
      if (!targets.length) {
        massRows.innerHTML = '<div class="empty" style="padding:18px">没有符合条件的已连接设备</div>';
        updateMassSummary(0, 0);
        return;
      }
      massRows.innerHTML = targets.map((d, index) => {
        const entry = ensureMassEntry(d.udid);
        return `<div class="mass-row ${massMode === "custom" && entry.selected === false ? "skipped" : ""}" data-udid="${esc(d.udid)}">
          <div class="mass-row-info">
            <div class="mass-row-name">${esc(d.name || "iPhone")}</div>
            <div class="mass-row-meta">${esc(d.group || "未分组")} · ${esc(d.connectionType || "USB")}</div>
            <label class="mass-row-check"><input type="checkbox" class="mass-row-select" ${entry.selected !== false ? "checked" : ""}> 参与本次群发</label>
          </div>
          <div>
            <textarea class="mass-row-text" placeholder="留空则使用默认内容" ${entry.useDefault ? "disabled" : ""}>${esc(entry.text)}</textarea>
          </div>
          <div>
            <label class="mass-row-check"><input type="checkbox" class="mass-row-usedefault" ${entry.useDefault ? "checked" : ""}> 使用默认</label>
          </div>
        </div>`;
      }).join("");
      updateMassSummary(targets.length, targets.filter(d => massMode === "custom" ? massEntries.get(d.udid).selected !== false : true).length);
    }

    function updateMassSummary(shown, selected) {
      const defaultReady = massDefault.value.trim().length > 0;
      massSummary.textContent = `显示 ${shown} 台 · 参与 ${selected} 台${defaultReady ? "" : " · 默认内容为空"}`;
      document.getElementById("mass-send").disabled = selected === 0;
    }

    function renderMassVariables(text, device, index) {
      return String(text || "")
        .replaceAll("{{name}}", device.name || "iPhone")
        .replaceAll("{{index}}", String(index + 1))
        .replaceAll("{{udid}}", device.udid);
    }

    function massPayloadForDevice(device, index) {
      const entry = massEntries.get(device.udid) || {text: "", useDefault: true};
      const raw = entry.useDefault || !entry.text.trim() ? massDefault.value : entry.text;
      const text = renderMassVariables(raw, device, index);
      return {text};
    }

    function openMassPanel() {
      massResultSection.hidden = true;
      massResults.innerHTML = "";
      massMessage.textContent = "";
      renderMassGroups();
      renderMassRows();
      massBackdrop.hidden = false;
    }

    function closeMassPanel() {
      massBackdrop.hidden = true;
    }

    massRows.addEventListener("input", event => {
      const row = event.target.closest(".mass-row");
      if (!row) return;
      const entry = ensureMassEntry(row.dataset.udid);
      if (event.target.classList.contains("mass-row-text")) {
        entry.text = event.target.value;
      }
    });
    massRows.addEventListener("change", event => {
      const row = event.target.closest(".mass-row");
      if (!row) return;
      const entry = ensureMassEntry(row.dataset.udid);
      if (event.target.classList.contains("mass-row-select")) {
        entry.selected = event.target.checked;
        row.classList.toggle("skipped", !event.target.checked);
        renderMassRows();
      } else if (event.target.classList.contains("mass-row-usedefault")) {
        entry.useDefault = event.target.checked;
        const text = row.querySelector(".mass-row-text");
        if (text) text.disabled = entry.useDefault;
      }
    });
    massDefault.addEventListener("input", () => renderMassRows());

    document.getElementById("mass-target-modes").addEventListener("click", event => {
      const chip = event.target.closest(".mass-chip");
      if (!chip) return;
      massMode = chip.dataset.mode;
      document.querySelectorAll(".mass-chip").forEach(c => c.classList.toggle("active", c === chip));
      massGroupRow.hidden = massMode !== "group";
      if (massMode === "group") renderMassGroups();
      renderMassRows();
    });
    massGroupSelect.addEventListener("change", () => {
      massGroup = massGroupSelect.value;
      updateMassGroupCount();
      renderMassRows();
    });

    document.querySelector(".mass-toolrow .mass-var")?.addEventListener("click", () => {});
    document.querySelectorAll(".mass-var").forEach(button => {
      button.addEventListener("click", () => {
        const token = button.dataset.var;
        const start = massDefault.selectionStart ?? massDefault.value.length;
        const end = massDefault.selectionEnd ?? start;
        massDefault.value = massDefault.value.slice(0, start) + token + massDefault.value.slice(end);
        massDefault.focus();
        massDefault.setSelectionRange(start + token.length, start + token.length);
        renderMassRows();
      });
    });

    document.getElementById("mass-fill-default").onclick = () => {
      for (const udid of massEntries.keys()) {
        massEntries.get(udid).useDefault = true;
      }
      renderMassRows();
    };
    document.getElementById("mass-clear-custom").onclick = () => {
      for (const entry of massEntries.values()) {
        entry.text = "";
        entry.useDefault = true;
      }
      massDefault.value = "";
      renderMassRows();
    };
    document.getElementById("mass-fill-lines").onclick = () => {
      const lines = window.prompt("按设备顺序输入内容，每行一台（空行表示该设备使用默认内容）：", "");
      if (lines === null) return;
      const pieces = lines.split("\n");
      const targets = massMode === "custom" ? massConnectedDevices().filter(d => massEntries.get(d.udid)?.selected !== false) : massTargetDevices();
      targets.forEach((device, index) => {
        const value = pieces[index];
        const entry = ensureMassEntry(device.udid);
        if (value !== undefined && value.trim() !== "") {
          entry.text = value.replace(/\r$/, "");
          entry.useDefault = false;
        } else {
          entry.text = "";
          entry.useDefault = true;
        }
      });
      renderMassRows();
    };

    function renderMassResults(result) {
      massResultSection.hidden = false;
      massResults.innerHTML = result.results.map(item => `
        <div class="mass-result ${item.ok ? "ok" : "fail"}">
          <span class="dot"></span>
          <span class="rname">${esc(item.name || item.udid)}</span>
          <span class="rerr">${item.ok ? "已发送" : esc(`${item.code || "error"}：${item.error || "失败"}`)}</span>
        </div>`).join("");
    }

    document.getElementById("mass-send").onclick = async () => {
      const connected = massConnectedDevices();
      const targets = massTargetDevices().filter(d => massMode !== "custom" || massEntries.get(d.udid)?.selected !== false);
      if (!targets.length) return;
      massMessage.textContent = "";
      const sendButton = document.getElementById("mass-send");
      sendButton.disabled = true;
      sendButton.textContent = "发送中…";
      try {
        const ordered = connected.filter(d => targets.some(t => t.udid === d.udid));
        const payload = {
          operation: "type",
          targets: ordered.map((device, index) => ({
            udid: device.udid,
            body: massPayloadForDevice(device, index)
          }))
        };
        const result = await request("/api/batch", {method: "POST", body: JSON.stringify(payload)});
        renderMassResults(result);
        const failures = result.results.filter(item => !item.ok);
        for (const failure of failures) {
          if (failure.code === "session_lost" || failure.code === "session_required") handleSessionLost(failure.udid);
        }
        massMessage.textContent = failures.length
          ? `成功 ${result.succeeded}/${result.total} 台，${failures.length} 台失败`
          : `已成功发送到 ${result.succeeded} 台设备`;
        massMessage.className = failures.length ? "message error" : "message";
        refreshDevices();
      } catch (error) {
        massMessage.textContent = error.message || "群发失败";
        massMessage.className = "message error";
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "开始群发";
        updateMassSummary(massMode === "custom" ? connected.length : massTargetDevices().length, targets.length);
      }
    };

    const massToggle = document.getElementById("mass-send-toggle");
    massToggle.onclick = () => {
      massToggle.classList.add("active");
      massToggle.setAttribute("aria-pressed", "true");
      openMassPanel();
    };
    document.getElementById("mass-close").onclick = () => {
      massBackdrop.hidden = true;
      massToggle.classList.remove("active");
      massToggle.setAttribute("aria-pressed", "false");
    };
    massBackdrop.addEventListener("click", event => {
      if (event.target === massBackdrop) document.getElementById("mass-close").click();
    });

    document.getElementById("all-devices-toggle").onclick = toggleAllDevicesControl;
    updateAllDevicesButton();
    previewToggle.onclick = () => {
      previewLiveEnabled = !previewLiveEnabled;
      updatePreviewToggle();
    };
    deviceList.addEventListener("input", event => {
      if (event.target?.id === "preview-size") applyPreviewSize(event.target.value, true);
    });
    try {
      const savedSize = localStorage.getItem("previewSize");
      if (savedSize) applyPreviewSize(savedSize);
    } catch (_) { /* storage may be unavailable */ }
    applyPreviewSize(previewSize);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && previewLiveEnabled) refreshDevicePreviews();
    });
    document.getElementById("refresh").onclick = refreshDevices;
    refreshDevices();
    setInterval(refreshDevices, 10000);
    setInterval(refreshDevicePreviews, PREVIEW_REFRESH_MS);
  </script>
</body>
</html>
